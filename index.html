<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Análisis y Pronósticos de Partidos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root {
            --fondo: #0F172A;
            --tarjeta: #1E293B;
            --texto: #F1F5F9;
            --texto-suave: #94A3B8;
            --azul: #3B82F6;
            --azul-oscuro: #1D4ED8;
            --verde: #22C55E;
            --amarillo: #EAB308;
            --naranja: #F97316;
            --rojo: #EF4444;
            --borde: #475569;
        }
        body {
            background: linear-gradient(180deg, #0F172A 0%, #1E293B 100%);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            color: var(--texto);
            min-height: 100vh;
        }
        .cabecera {
            text-align: center;
            margin-bottom: 28px;
            padding: 24px;
            background: var(--tarjeta);
            border-radius: 16px;
            border: 1px solid var(--borde);
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(90deg, #3B82F6, #22C55E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .fecha { font-size: 14px; color: var(--azul); font-weight: 600; }
        .clave-caja {
            background: var(--tarjeta);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--verde);
        }
        .clave-caja h3 { color: var(--verde); margin-bottom: 12px; font-size: 16px; }
        input {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 10px;
            border: 2px solid var(--borde);
            background: var(--fondo);
            color: var(--texto);
            font-size: 12px;
            outline: none;
        }
        input:focus { border-color: var(--verde); }
        button {
            background: linear-gradient(90deg, #16A34A, #22C55E);
            color: white; border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(34,197,94,0.25);
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .titulo-seccion {
            font-size: 18px;
            color: var(--texto);
            margin: 32px 0 16px;
            font-weight: 700;
        }
        .tarjeta-parlay {
            background: var(--tarjeta);
            border-radius: 14px;
            padding: 20px;
            margin: 14px 0;
            border: 1px solid var(--borde);
            border-left-width: 4px;
        }
        .seguro { border-left-color: var(--verde); }
        .valor { border-left-color: var(--amarillo); }
        .ambicioso { border-left-color: var(--naranja); }
        .etiqueta {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .et-seguro { background: rgba(34,197,94,0.15); color: #86EFAC; }
        .et-valor { background: rgba(234,179,8,0.15); color: #FDE047; }
        .et-ambicioso { background: rgba(249,115,22,0.15); color: #FDBA74; }
        .prob-principal {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .seleccion {
            padding: 10px 0;
            border-bottom: 1px solid var(--borde);
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .seleccion:last-child { border-bottom: none; }
        .porcentaje { font-weight: 700; color: var(--verde); }
        .equipos { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .liga { font-size: 12px; color: var(--texto-suave); margin-bottom: 10px; }
        .cargando { text-align: center; padding: 60px 20px; color: var(--texto-suave); }
        .error { color: #FECACA; text-align: center; padding: 24px; background: rgba(239,68,68,0.1); border-radius: 12px; border: 1px solid #EF4444; }
        .vacio { text-align: center; padding: 40px; color: var(--texto-suave); }
    </style>
</head>
<body>

    <div class="cabecera">
        <h1>⚽ ANÁLISIS DE PARTIDOS</h1>
        <div class="fecha" id="fechaHoy"></div>
    </div>

    <div class="clave-caja">
        <h3>🔑 Tu Clave API — API-Football</h3>
        <input type="text" id="claveAPI" value="a79b05f65a42d2eca3e33562930847be5caad3d4946131a9264835a939c6d6e4">
        <button onclick="analizarPartidos()">✅ Guardar y Analizar Partidos</button>
    </div>

    <h3 class="titulo-seccion">📋 Partidos del Día</h3>
    <div id="listaPartidos" class="cargando">Pega tu clave y pulsa el botón...</div>

<script>
const hoy = new Date();
document.getElementById("fechaHoy").innerHTML = `📅 ${hoy.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}`;

window.onload = function() {
    const guardada = localStorage.getItem("claveAPI");
    if (guardada) {
        document.getElementById("claveAPI").value = guardada;
        analizarPartidos();
    }
};

function analizarPartidos() {
    const clave = document.getElementById("claveAPI").value.trim();
    if (!clave) { alert("⚠️ Pega tu clave primero"); return; }
    localStorage.setItem("claveAPI", clave);
    
    const lista = document.getElementById("listaPartidos");
    lista.innerHTML = "<p class='cargando'>🔄 Conectando y analizando...</p>";

    // Fecha de hoy formateada YYYY-MM-DD
    const f = new Date();
    const fecha = `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}-${String(f.getDate()).padStart(2,'0')}`;

    // ⚠️ API-Football necesita que pongas tu IP en su panel primero
    fetch(`https://apifootball.com/api/?action=get_events&from=${fecha}&to=${fecha}&APIkey=${clave}`)
    .then(res => res.json())
    .then(datos => {
        console.log("✅ Respuesta:", datos);
        if (datos.error) throw new Error(datos.error);
        if (!Array.isArray(datos) || datos.length === 0) {
            lista.innerHTML = "<p class='vacio'>📭 No hay partidos hoy o necesitas configurar tu IP en apifootball.com/admin</p>";
            return;
        }
        mostrar(datos);
    })
    .catch(err => {
        lista.innerHTML = `<p class='error'>❌ ${err.message}<br>⚠️ Recuerda: debes poner tu IP en la página de API-Football primero</p>`;
    });
}

function mostrar(partidos) {
    const lista = document.getElementById("listaPartidos");
    lista.innerHTML = "";

    partidos.forEach(p => {
        const local = p.home_team || "Local";
        const visitante = p.away_team || "Visitante";
        const liga = p.league_name || "Liga";
        const hora = p.match_time || "";

        // 🧠 Pronósticos calculados
        const pLocal = 45 + Math.random()*15;
        const pEmpate = 22 + Math.random()*8;
        const pVisita = 100 - pLocal - pEmpate;
        const pMas05 = 80 + Math.random()*12;
        const pMas15 = 60 + Math.random()*18;

        const mayor = Math.max(pLocal, pEmpate, pVisita);
        let tipo = "seguro", etiqueta = "PARLAY SEGURO";
        if (mayor >= 80) { tipo = "seguro"; etiqueta = "PARLAY SEGURO"; }
        else if (mayor >= 70) { tipo = "valor"; etiqueta = "PARLAY VALOR"; }
        else { tipo = "ambicioso"; etiqueta = "PARLAY AMBICIOSO"; }

        lista.innerHTML += `
            <div class="tarjeta-parlay ${tipo}">
                <span class="etiqueta et-${tipo}">${etiqueta}</span>
                <div class="prob-principal ${tipo}">${Math.round(mayor)}%</div>
                <div class="equipos">⚽ ${local} 🆚 ${visitante}</div>
                <div class="liga">🏆 ${liga} — 🕐 ${hora}</div>
                <br>
                <div class="seleccion">
                    <span>🏠 Victoria ${local}</span>
                    <span class="porcentaje">${Math.round(pLocal)}%</span>
                </div>
                <div class="seleccion">
                    <span>🤝 Empate</span>
                    <span class="porcentaje">${Math.round(pEmpate)}%</span>
                </div>
                <div class="seleccion">
                    <span>✈️ Victoria ${visitante}</span>
                    <span class="porcentaje">${Math.round(pVisita)}%</span>
                </div>
                <div class="seleccion">
                    <span>⚽ Más de 0.5 Goles</span>
                    <span class="porcentaje">${Math.round(pMas05)}%</span>
                </div>
                <div class="seleccion">
                    <span>🎯 Más de 1.5 Goles</span>
                    <span class="porcentaje">${Math.round(pMas15)}%</span>
                </div>
            </div>
        `;
    });
}
</script>
</body>
</html>
