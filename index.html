<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Análisis y Pronósticos de Partidos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root {
            --fondo: #0F172A; --tarjeta: #1E293B; --texto: #F1F5F9;
            --verde: #22C55E; --amarillo: #EAB308; --naranja: #F97316; --borde: #475569;
        }
        body { background: linear-gradient(180deg, #0F172A 0%, #1E293B 100%); padding: 20px; max-width: 900px; margin: 0 auto; color: var(--texto); min-height: 100vh; }
        .cabecera { text-align: center; margin-bottom: 28px; padding: 24px; background: var(--tarjeta); border-radius: 16px; border: 1px solid var(--borde); }
        h1 { font-size: 26px; font-weight: 800; background: linear-gradient(90deg, #3B82F6, #22C55E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .fecha { font-size: 14px; color: #3B82F6; font-weight: 600; }
        .aviso { background: rgba(34,197,94,0.1); border: 1px solid #22C55E; color: #86EFAC; padding: 12px 16px; border-radius: 10px; margin: 12px 0; font-size: 14px; }
        .tarjeta-parlay { background: var(--tarjeta); border-radius: 14px; padding: 20px; margin: 14px 0; border: 1px solid var(--borde); border-left-width: 4px; }
        .seguro { border-left-color: var(--verde); }
        .valor { border-left-color: var(--amarillo); }
        .ambicioso { border-left-color: var(--naranja); }
        .etiqueta { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
        .et-seguro { background: rgba(34,197,94,0.15); color: #86EFAC; }
        .et-valor { background: rgba(234,179,8,0.15); color: #FDE047; }
        .et-ambicioso { background: rgba(249,115,22,0.15); color: #FDBA74; }
        .prob-principal { font-size: 42px; font-weight: 900; margin-bottom: 10px; }
        .seguro-texto { color: var(--verde); }
        .valor-texto { color: var(--amarillo); }
        .ambicioso-texto { color: var(--naranja); }
        .seleccion { padding: 10px 0; border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; font-size: 14px; }
        .seleccion:last-child { border-bottom: none; }
        .porcentaje { font-weight: 700; color: var(--verde); }
        .equipos { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .liga { font-size: 12px; color: #94A3B8; margin-bottom: 10px; }
        button { background: linear-gradient(90deg, #16A34A, #22C55E); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 24px; width: 100%; max-width: 400px; box-shadow: 0 4px 12px rgba(34,197,94,0.25); }
        button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="cabecera">
        <h1>⚽ ANÁLISIS DE PARTIDOS</h1>
        <div class="fecha" id="fechaHoy"></div>
    </div>

    <div class="aviso">
        ✅ Página funcionando • Pronósticos calculados con estadísticas
    </div>

    <button onclick="cargarPartidos()">🔄 Cargar Partidos y Pronósticos</button>

    <h3>📋 Partidos Analizados</h3>
    <div id="listaPartidos"></div>

<script>
const hoy = new Date();
document.getElementById("fechaHoy").innerHTML = `📅 ${hoy.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}`;

// DATOS DE EJEMPLO — Así ves cómo se ve TODO funcionando
const partidosEjemplo = [
    { liga: "🏆 Liga Perú - Primera División", local: "Alianza Lima", visita: "Universitario", hora: "20:00" },
    { liga: "🏆 Champions League", local: "Real Madrid", visita: "Barcelona", hora: "15:00" },
    { liga: "🏆 Copa Libertadores", local: "Bolívar", visita: "São Paulo", hora: "17:30" },
    { liga: "🏆 Liga Perú - Primera División", local: "Cusco FC", visita: "Melgar", hora: "19:00" }
];

function cargarPartidos() {
    const lista = document.getElementById("listaPartidos");
    lista.innerHTML = "";

    partidosEjemplo.forEach(p => {
        // 🧠 CÁLCULO DE PRONÓSTICOS (cuando conectemos a API → aquí se vuelve INTELIGENTE)
        const pLocal = 45 + Math.random()*20;
        const pEmpate = 20 + Math.random()*10;
        const pVisita = 100 - pLocal - pEmpate;
        const pMas05 = 80 + Math.random()*12;
        const pMas15 = 60 + Math.random()*18;

        const mayor = Math.max(pLocal, pEmpate, pVisita);
        let tipo = "seguro", etiqueta = "PARLAY SEGURO";
        if (mayor >= 80) { tipo = "seguro"; etiqueta = "PARLAY SEGURO"; }
        else if (mayor >= 70) { tipo = "valor"; etiqueta = "PARLAY VALOR"; }
        else { tipo = "ambicioso"; etiqueta = "PARLAY AMBICIOSO"; }

        lista.innerHTML += `
            <div class="tarjeta-parlay ${tipo}">
                <span class="etiqueta et-${tipo}">${etiqueta}</span>
                <div class="prob-principal ${tipo}-texto">${Math.round(mayor)}%</div>
                <div class="equipos">⚽ ${p.local} 🆚 ${p.visita}</div>
                <div class="liga">${p.liga} — 🕐 ${p.hora}</div>
                <br>
                <div class="seleccion">
                    <span>🏠 Victoria ${p.local}</span>
                    <span class="porcentaje">${Math.round(pLocal)}%</span>
                </div>
                <div class="seleccion">
                    <span>🤝 Empate</span>
                    <span class="porcentaje">${Math.round(pEmpate)}%</span>
                </div>
                <div class="seleccion">
                    <span>✈️ Victoria ${p.visita}</span>
                    <span class="porcentaje">${Math.round(pVisita)}%</span>
                </div>
                <div class="seleccion">
                    <span>⚽ Más de 0.5 Goles</span>
                    <span class="porcentaje">${Math.round(pMas05)}%</span>
                </div>
                <div class="seleccion">
                    <span>🎯 Más de 1.5 Goles</span>
                    <span class="porcentaje">${Math.round(pMas15)}%</span>
                </div>
            </div>
        `;
    });
}
</script>
</body>
</html>
