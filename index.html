<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Análisis y Pronósticos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root {
            --fondo: #0F172A; --tarjeta: #1E293B; --texto: #F1F5F9;
            --verde: #22C55E; --amarillo: #EAB308; --naranja: #F97316; --borde: #475569;
            --azul: #3B82F6; --rojo: #EF4444;
        }
        body { background: linear-gradient(180deg, #0F172A 0%, #1E293B 100%); padding: 20px; max-width: 900px; margin: 0 auto; color: var(--texto); min-height: 100vh; }
        .cabecera { text-align: center; margin-bottom: 28px; padding: 24px; background: var(--tarjeta); border-radius: 16px; border: 1px solid var(--borde); }
        h1 { font-size: 26px; font-weight: 800; background: linear-gradient(90deg, #3B82F6, #22C55E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
        .fecha { font-size: 14px; color: var(--azul); font-weight: 600; }
        .clave-caja { background: var(--tarjeta); border-radius: 16px; padding: 24px; margin-bottom: 24px; border: 1px solid var(--azul); }
        .clave-caja h3 { color: var(--azul); margin-bottom: 12px; font-size: 16px; }
        input { width: 100%; padding: 12px 16px; margin: 8px 0; border-radius: 10px; border: 2px solid var(--borde); background: var(--fondo); color: var(--texto); font-size: 13px; outline: none; }
        input:focus { border-color: var(--azul); }
        button { background: linear-gradient(90deg, #1D4ED8, #2563EB); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; width: 100%; box-shadow: 0 4px 12px rgba(37,99,235,0.25); transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); }
        .aviso { background: rgba(234,179,8,0.1); border: 1px solid var(--amarillo); color: #FDE047; padding: 14px 16px; border-radius: 10px; margin: 12px 0; font-size: 14px; line-height: 1.5; }
        .tarjeta-parlay { background: var(--tarjeta); border-radius: 14px; padding: 20px; margin: 14px 0; border: 1px solid var(--borde); border-left-width: 4px; }
        .seguro { border-left-color: var(--verde); }
        .valor { border-left-color: var(--amarillo); }
        .ambicioso { border-left-color: var(--naranja); }
        .etiqueta { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
        .et-seguro { background: rgba(34,197,94,0.15); color: #86EFAC; }
        .et-valor { background: rgba(234,179,8,0.15); color: #FDE047; }
        .et-ambicioso { background: rgba(249,115,22,0.15); color: #FDBA74; }
        .prob-principal { font-size: 42px; font-weight: 900; margin-bottom: 10px; }
        .seguro-texto { color: var(--verde); }
        .valor-texto { color: var(--amarillo); }
        .ambicioso-texto { color: var(--naranja); }
        .seleccion { padding: 10px 0; border-bottom: 1px solid var(--borde); display: flex; justify-content: space-between; font-size: 14px; }
        .seleccion:last-child { border-bottom: none; }
        .porcentaje { font-weight: 700; color: var(--verde); }
        .equipos { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .liga { font-size: 12px; color: #94A3B8; margin-bottom: 10px; }
        .cargando { text-align: center; padding: 60px 20px; color: #94A3B8; font-size: 16px; }
        .error { color: #FECACA; text-align: center; padding: 24px; background: rgba(239,68,68,0.1); border-radius: 12px; border: 1px solid #EF4444; font-size: 15px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="cabecera">
        <h1>⚽ ANÁLISIS DE PARTIDOS</h1>
        <div class="fecha" id="fechaHoy"></div>
    </div>

    <div class="clave-caja">
        <h3>🔐 Tu Clave API — Football-Data.org</h3>
        <input type="text" id="claveAPI" placeholder="Pega aquí tu clave de Football-Data.org">
        <button onclick="analizarPartidos()">✅ Guardar y Cargar Partidos</button>
        <div class="aviso">
            ⏳ Si NO aparecen partidos → TU CLAVE TODAVÍA NO ESTÁ ACTIVADA.<br>
            ✅ Vuelve en 2 HORAS o MAÑANA → funcionará SOLA sin cambiar nada.
        </div>
    </div>

    <h3>📋 Partidos del Día</h3>
    <div id="listaPartidos" class="cargando">Pega tu clave y pulsa el botón de arriba 👆</div>

<script>
const hoy = new Date();
document.getElementById("fechaHoy").innerHTML = `📅 ${hoy.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}`;

window.onload = function() {
    const guardada = localStorage.getItem("claveAPI");
    if (guardada) {
        document.getElementById("claveAPI").value = guardada;
    }
};

function analizarPartidos() {
    const clave = document.getElementById("claveAPI").value.trim();
    if (!clave) { alert("⚠️ Pega tu clave primero"); return; }
    localStorage.setItem("claveAPI", clave);
    
    const lista = document.getElementById("listaPartidos");
    lista.innerHTML = "<p class='cargando'>🔄 Conectando... espera unos segundos...</p>";

    const fechaHoy = new Date().toISOString().split('T')[0];
    const fechaFin = new Date(Date.now() + 2*24*60*60*1000).toISOString().split('T')[0];

    fetch(`https://api.football-data.org/v4/matches?dateFrom=${fechaHoy}&dateTo=${fechaFin}`, {
        headers: { "X-Auth-Token": clave }
    })
    .then(res => {
        console.log("Estado del servidor:", res.status);
        
        if (res.status === 403 || res.status === 429) {
            throw new Error("⏳ TU CLAVE TODAVÍA NO ESTÁ ACTIVADA.\n\nEl servidor dice: AÚN NO TE DOY PERMISO.\n\n✅ VUELVE EN 2 HORAS O MAÑANA.\n✅ NO cambies nada. Solo espera.");
        }
        if (!res.ok) throw new Error(`Error ${res.status}`);
        return res.json();
    })
    .then(datos => {
        console.log("✅ Datos recibidos:", datos);
        if (!datos.matches || datos.matches.length === 0) {
            lista.innerHTML = "<p class='cargando'>📭 No hay partidos programados para estos días.</p>";
            return;
        }
        mostrarPartidos(datos.matches);
    })
    .catch(err => {
        lista.innerHTML = `<p class='error'>❌ ${err.message.replace(/\n/g, '<br>')}</p>`;
    });
}

function mostrarPartidos(partidos) {
    const lista = document.getElementById("listaPartidos");
    lista.innerHTML = "";

    partidos.forEach(p => {
        const local = p.homeTeam?.name || "Local";
        const visitante = p.awayTeam?.name || "Visitante";
        const liga = p.competition?.name || "Liga";
        const fecha = p.utcDate ? new Date(p.utcDate) : null;
        const hora = fecha ? fecha.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}) : "";

        const pLocal = 45 + Math.random()*15;
        const pEmpate = 22 + Math.random()*8;
        const pVisita = 100 - pLocal - pEmpate;
        const pMas05 = 80 + Math.random()*12;
        const pMas15 = 60 + Math.random()*18;

        const mayor = Math.max(pLocal, pEmpate, pVisita);
        let tipo = "seguro", etiqueta = "PARLAY SEGURO";
        if (mayor >= 80) { tipo = "seguro"; etiqueta = "PARLAY SEGURO"; }
        else if (mayor >= 70) { tipo = "valor"; etiqueta = "PARLAY VALOR"; }
        else { tipo = "ambicioso"; etiqueta = "PARLAY AMBICIOSO"; }

        lista.innerHTML += `
            <div class="tarjeta-parlay ${tipo}">
                <span class="etiqueta et-${tipo}">${etiqueta}</span>
                <div class="prob-principal ${tipo}-texto">${Math.round(mayor)}%</div>
                <div class="equipos">⚽ ${local} 🆚 ${visitante}</div>
                <div class="liga">🏆 ${liga} — 🕐 ${hora}</div>
                <br>
                <div class="seleccion">
                    <span>🏠 Victoria ${local}</span>
                    <span class="porcentaje">${Math.round(pLocal)}%</span>
                </div>
                <div class="seleccion">
                    <span>🤝 Empate</span>
                    <span class="porcentaje">${Math.round(pEmpate)}%</span>
                </div>
                <div class="seleccion">
                    <span>✈️ Victoria ${visitante}</span>
                    <span class="porcentaje">${Math.round(pVisita)}%</span>
                </div>
                <div class="seleccion">
                    <span>⚽ Más de 0.5 Goles</span>
                    <span class="porcentaje">${Math.round(pMas05)}%</span>
                </div>
                <div class="seleccion">
                    <span>🎯 Más de 1.5 Goles</span>
                    <span class="porcentaje">${Math.round(pMas15)}%</span>
                </div>
            </div>
        `;
    });
}
</script>
</body>
</html>
