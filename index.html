<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Análisis de Partidos | Datos en Vivo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }

        :root {
            --fondo-pagina: #F8FAFC;
            --tarjeta-fondo: #FFFFFF;
            --texto-oscuro: #0F172A;
            --texto-medio: #475569;
            --texto-claro: #94A3B8;
            --azul-oscuro: #1E40AF;
            --azul-primario: #2563EB;
            --azul-claro: #3B82F6;
            --azul-suave: #DBEAFE;
            --verde-oscuro: #15803D;
            --verde: #22C55E;
            --verde-claro: #4ADE80;
            --cian: #0891B2;
            --dorado: #D97706;
            --rojo: #DC2626;
            --borde-suave: #E2E8F0;
            --sombra-normal: 0 4px 15px rgba(15, 23, 42, 0.08);
            --sombra-media: 0 8px 30px rgba(37, 99, 235, 0.12);
            --borde-redondo: 16px;
            --transicion: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: linear-gradient(180deg, #EFF6FF 0%, #F8FAFC 100%);
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
            color: var(--texto-oscuro);
            min-height: 100vh;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 32px;
            padding: 28px 20px;
            background: var(--tarjeta-fondo);
            border-radius: var(--borde-redondo);
            box-shadow: var(--sombra-media);
            border: 1px solid var(--azul-suave);
            position: relative;
            overflow: hidden;
        }

        .cabecera::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--azul-oscuro), var(--azul-primario), var(--cian));
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(90deg, #1E40AF, #2563EB, #0891B2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .fecha-hoy {
            font-size: 16px;
            color: var(--azul-primario);
            font-weight: 600;
        }

        .barra-superior {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .info-texto {
            font-size: 14px;
            color: var(--texto-medio);
            font-weight: 500;
        }

        .btn-config {
            background: var(--tarjeta-fondo);
            border: 1px solid var(--borde-suave);
            color: var(--texto-medio);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transicion);
        }

        .btn-config:hover {
            border-color: var(--azul-claro);
            color: var(--azul-primario);
        }

        .tarjeta-clave {
            background: var(--tarjeta-fondo);
            border-radius: var(--borde-redondo);
            padding: 28px;
            margin-bottom: 28px;
            box-shadow: var(--sombra-media);
            border: 1px solid var(--azul-suave);
        }

        .tarjeta-clave h3 {
            color: var(--azul-oscuro);
            margin-bottom: 14px;
            font-size: 18px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            margin: 10px 0;
            border-radius: 12px;
            border: 2px solid var(--borde-suave);
            background: var(--fondo-pagina);
            color: var(--texto-oscuro);
            font-size: 15px;
            font-weight: 500;
            transition: var(--transicion);
            outline: none;
        }

        input:focus {
            border-color: var(--azul-primario);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .btn-primario {
            background: linear-gradient(90deg, #1E40AF, #2563EB);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
            transition: var(--transicion);
        }

        .btn-primario:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
        }

        .seccion-titulo {
            font-size: 20px;
            color: var(--texto-oscuro);
            margin: 32px 0 16px;
            font-weight: 700;
        }

        .tarjeta-partido {
            background: var(--tarjeta-fondo);
            border-radius: var(--borde-redondo);
            padding: 20px 24px;
            margin: 12px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid var(--borde-suave);
            transition: var(--transicion);
            cursor: pointer;
        }

        .tarjeta-partido:hover {
            transform: translateY(-3px);
            box-shadow: var(--sombra-normal);
            border-color: var(--azul-claro);
        }

        .liga-nombre {
            font-size: 13px;
            color: var(--azul-primario);
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .equipos-nombre {
            font-size: 18px;
            font-weight: 700;
            color: var(--texto-oscuro);
            margin-bottom: 6px;
        }

        .hora-fecha {
            font-size: 14px;
            color: var(--texto-medio);
            font-weight: 500;
        }

        .cargando {
            text-align: center;
            padding: 50px 20px;
            color: var(--texto-medio);
            font-size: 16px;
        }

        .error {
            color: #B91C1C;
            text-align: center;
            padding: 24px;
            background: #FEF2F2;
            border-radius: 12px;
            border: 1px solid #FECACA;
            font-weight: 500;
        }

        .vacio {
            text-align: center;
            padding: 40px;
            color: var(--texto-medio);
        }

        @media (max-width: 768px) {
            body { padding: 16px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="cabecera">
        <h1>⚽ ANÁLISIS DE PARTIDOS</h1>
        <div class="fecha-hoy" id="fechaHoy"></div>
    </div>

    <div class="barra-superior">
        <div class="info-texto">📊 Datos en tiempo real — API activa al instante</div>
        <button class="btn-config" onclick="mostrarClave()">⚙️ Cambiar Clave API</button>
    </div>

    <!-- Tarjeta de Clave - SIEMPRE VISIBLE -->
    <div class="tarjeta-clave" id="tarjetaClave">
        <h3>🔐 Tu Clave API - RapidAPI</h3>
        <input type="text" id="claveAPI" placeholder="Pega aquí tu clave X-RapidAPI-Key">
        <button class="btn-primario" onclick="guardarClave()">✅ Guardar y Cargar Partidos</button>
        <p style="font-size:13px; color:var(--texto-medio); margin-top:10px;">Tu clave se guarda solo en tu navegador. Nunca más tendrás que escribirla.</p>
    </div>

    <h3 class="seccion-titulo">📋 Próximos Partidos</h3>
    <div id="listaPartidos" class="cargando">Esperando tu clave API...</div>

<script>
let claveAPI = "";

// Mostrar fecha de hoy
const hoy = new Date();
document.getElementById("fechaHoy").innerHTML = `📅 ${hoy.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}`;

// Al cargar página → buscar clave guardada
window.onload = function() {
    const claveGuardada = localStorage.getItem("claveAPI");
    if (claveGuardada) {
        claveAPI = claveGuardada;
        document.getElementById("claveAPI").value = claveAPI;
        cargarPartidos();
    } else {
        document.getElementById("listaPartidos").innerHTML = "<p class='cargando'>Pega tu clave de RapidAPI y pulsa Guardar.</p>";
    }
};

function mostrarClave() {
    document.getElementById("tarjetaClave").style.display = "block";
}

function guardarClave() {
    claveAPI = document.getElementById("claveAPI").value.trim();
    if (!claveAPI) {
        alert("⚠️ Pega tu clave primero");
        return;
    }
    localStorage.setItem("claveAPI", claveAPI);
    alert("✅ Clave guardada! Cargando partidos...");
    cargarPartidos();
}

async function cargarPartidos() {
    const lista = document.getElementById("listaPartidos");
    lista.innerHTML = "<p class='cargando'>🔄 Conectando a RapidAPI...</p>";

    try {
        // Fecha de hoy formateada
        const fecha = new Date().toISOString().split('T')[0];
        
        const respuesta = await fetch(
            `"https://free-api-live-football-data.p.rapidapi.com/football-current-live",
            {
                headers: {
                    "X-RapidAPI-Key": claveAPI,
                    "X-RapidAPI-Host": "free-api-live-football-data.p.rapidapi.com"
                }
            }
        );

        if (!respuesta.ok) throw new Error("Error al conectar. Verifica tu clave.");

        const datos = await respuesta.json();
        console.log("Datos recibidos:", datos);
        
        // Si llegamos aquí → procesamos los datos
        mostrarPartidos(datos);

    } catch (error) {
        lista.innerHTML = `<p class='error'>❌ ${error.message}<br>⏳ Verifica que tu clave sea correcta y esté activada.</p>`;
        console.error("Error:", error);
    }
}

function mostrarPartidos(datos) {
    const lista = document.getElementById("listaPartidos");
    
    // Intentamos distintas rutas según cómo vengan los datos
    let partidos = [];
    
    if (datos && datos.response && Array.isArray(datos.response)) {
        partidos = datos.response;
    } else if (datos && Array.isArray(datos)) {
        partidos = datos;
    } else {
        lista.innerHTML = `<p class='vacio'>📭 Estructura de datos recibida. Esperando formato de partidos.<br><small>Consola F12 para ver detalles.</small></p>`;
        console.log("Datos completos:", datos);
        return;
    }

    if (partidos.length === 0) {
        lista.innerHTML = "<p class='vacio'>📭 No hay partidos programados para hoy.</p>";
        return;
    }

    lista.innerHTML = "";

    partidos.forEach(partido => {
        const local = partido.teams?.home?.name || "Equipo Local";
        const visitante = partido.teams?.away?.name || "Equipo Visitante";
        const liga = partido.league?.name || "Liga Desconocida";
        const fecha = partido.fixture?.date || "";
        const hora = fecha ? new Date(fecha).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}) : "";

        lista.innerHTML += `
            <div class="tarjeta-partido">
                <div class="liga-nombre">🏆 ${liga}</div>
                <div class="equipos-nombre">${local} 🆚 ${visitante}</div>
                <div class="hora-fecha">🕐 ${hora}</div>
            </div>
        `;
    });
}
</script>
</body>
</html>
