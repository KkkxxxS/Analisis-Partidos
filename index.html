<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Análisis y Pronósticos de Partidos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        :root {
            --fondo: #0F172A;
            --tarjeta: #1E293B;
            --tarjeta-clara: #334155;
            --texto: #F1F5F9;
            --texto-suave: #94A3B8;
            --azul: #3B82F6;
            --azul-oscuro: #1D4ED8;
            --verde: #22C55E;
            --verde-oscuro: #16A34A;
            --amarillo: #EAB308;
            --naranja: #F97316;
            --rojo: #EF4444;
            --borde: #475569;
            --seguro: #22C55E;
            --valor: #EAB308;
            --riesgo: #F97316;
            --ambicioso: #EF4444;
        }
        body {
            background: linear-gradient(180deg, #0F172A 0%, #1E293B 100%);
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            color: var(--texto);
            min-height: 100vh;
        }
        .cabecera {
            text-align: center;
            margin-bottom: 28px;
            padding: 24px;
            background: var(--tarjeta);
            border-radius: 16px;
            border: 1px solid var(--borde);
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(90deg, #3B82F6, #22C55E);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .fecha { font-size: 14px; color: var(--azul); font-weight: 600; }
        .clave-caja {
            background: var(--tarjeta);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid var(--azul);
        }
        .clave-caja h3 { color: var(--azul); margin-bottom: 12px; font-size: 16px; }
        input {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0;
            border-radius: 10px;
            border: 2px solid var(--borde);
            background: var(--fondo);
            color: var(--texto);
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: var(--azul); }
        button {
            background: linear-gradient(90deg, #1D4ED8, #2563EB);
            color: white; border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            width: 100%;
            box-shadow: 0 4px 12px rgba(37,99,235,0.25);
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        .aviso {
            background: rgba(234,179,8,0.1);
            border: 1px solid var(--amarillo);
            color: #FDE047;
            padding: 12px 16px;
            border-radius: 10px;
            margin: 12px 0;
            font-size: 14px;
        }
        .titulo-seccion {
            font-size: 18px;
            color: var(--texto);
            margin: 32px 0 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .parlay-seguro { border-left: 4px solid var(--seguro); }
        .parlay-valor { border-left: 4px solid var(--valor); }
        .parlay-ambicioso { border-left: 4px solid var(--ambicioso); }
        .tarjeta-parlay {
            background: var(--tarjeta);
            border-radius: 14px;
            padding: 20px;
            margin: 14px 0;
            border: 1px solid var(--borde);
        }
        .probabilidad-principal {
            font-size: 42px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 12px;
        }
        .seguro { color: var(--seguro); }
        .valor { color: var(--valor); }
        .ambicioso { color: var(--ambicioso); }
        .etiqueta-tipo {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .et-seguro { background: rgba(34,197,94,0.15); color: #86EFAC; }
        .et-valor { background: rgba(234,179,8,0.15); color: #FDE047; }
        .et-ambicioso { background: rgba(249,115,22,0.15); color: #FDBA74; }
        .seleccion {
            padding: 10px 0;
            border-bottom: 1px solid var(--borde);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .seleccion:last-child { border-bottom: none; }
        .mercado { font-size: 14px; font-weight: 500; }
        .confianza { font-size: 15px; font-weight: 700; color: var(--verde); }
        .cargando { text-align: center; padding: 60px 20px; color: var(--texto-suave); }
        .error { color: #FECACA; text-align: center; padding: 24px; background: rgba(239,68,68,0.1); border-radius: 12px; border: 1px solid #EF4444; }
        .partido-preview {
            background: var(--tarjeta);
            border-radius: 12px;
            padding: 16px;
            margin: 10px 0;
            border: 1px solid var(--borde);
        }
        .equipos { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .liga { font-size: 12px; color: var(--texto-suave); }
        .vacio { text-align: center; padding: 40px; color: var(--texto-suave); }
        @media (max-width: 600px) {
            body { padding: 12px; }
            h1 { font-size: 20px; }
            .probabilidad-principal { font-size: 32px; }
        }
    </style>
</head>
<body>

    <div class="cabecera">
        <h1>⚽ ANÁLISIS DE PARTIDOS</h1>
        <div class="fecha" id="fechaHoy"></div>
    </div>

    <div class="clave-caja">
        <h3>🔐 Tu Clave API — Football-Data.org</h3>
        <input type="text" id="claveAPI" placeholder="Pega aquí tu clave de Football-Data.org">
        <button onclick="guardarClave()">✅ Guardar y Analizar Partidos</button>
        <div class="aviso">⏳ Si da error → tu clave se está activando. Vuelve en 1-2 horas o mañana.</div>
    </div>

    <h3 class="titulo-seccion">📋 Partidos del Día</h3>
    <div id="listaPartidos" class="cargando">Pega tu clave y pulsa el botón para empezar...</div>

<script>
let claveAPI = "";

// Fecha de hoy formateada
const hoy = new Date();
document.getElementById("fechaHoy").innerHTML = `📅 ${hoy.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}`;

// Cargar clave guardada
window.onload = function() {
    const guardada = localStorage.getItem("claveAPI");
    if (guardada) {
        claveAPI = guardada;
        document.getElementById("claveAPI").value = claveAPI;
        analizarPartidos();
    }
};

function guardarClave() {
    claveAPI = document.getElementById("claveAPI").value.trim();
    if (!claveAPI) { alert("⚠️ Pega tu clave primero"); return; }
    localStorage.setItem("claveAPI", claveAPI);
    alert("✅ Clave guardada! Analizando partidos...");
    analizarPartidos();
}

async function analizarPartidos() {
    const lista = document.getElementById("listaPartidos");
    lista.innerHTML = "<p class='cargando'>🔄 Conectando y analizando datos...</p>";

    try {
        // Fecha de hoy y mañana
        const fechaHoy = new Date().toISOString().split('T')[0];
        const fechaManana = new Date(Date.now() + 2*24*60*60*1000).toISOString().split('T')[0];

        // Pedir partidos próximos
        const respuesta = await fetch(
            `https://api.football-data.org/v4/matches?dateFrom=${fechaHoy}&dateTo=${fechaManana}`,
            { headers: { "X-Auth-Token": claveAPI } }
        );

        console.log("Estado API:", respuesta.status);

        if (respuesta.status === 403 || respuesta.status === 429) {
            throw new Error("⏳ Tu clave todavía se está activando por Football-Data.org. Vuelve en 1-2 horas o mañana y funcionará sola.");
        }
        if (!respuesta.ok) throw new Error(`Error ${respuesta.status} — Verifica tu clave.`);

        const datos = await respuesta.json();
        console.log("✅ Partidos recibidos:", datos);
        mostrarPartidosYPronosticos(datos.matches || []);

    } catch (error) {
        lista.innerHTML = `<p class='error'>❌ ${error.message}</p>`;
    }
}

function mostrarPartidosYPronosticos(partidos) {
    const lista = document.getElementById("listaPartidos");
    
    if (partidos.length === 0) {
        lista.innerHTML = "<p class='vacio'>📭 No hay partidos programados para los próximos días.</p>";
        return;
    }

    lista.innerHTML = "";

    // Analizar cada partido
    partidos.forEach(p => {
        const local = p.homeTeam?.name || "Local";
        const visitante = p.awayTeam?.name || "Visitante";
        const liga = p.competition?.name || "Liga";
        const fecha = p.utcDate ? new Date(p.utcDate) : null;
        const hora = fecha ? fecha.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}) : "";

        // 🧠 CÁLCULO DE PRONÓSTICOS (cuando tengamos estadísticas reales se perfecciona)
        // Por ahora: lógica basada en ranking y estado
        const probLocal = calcularProbabilidad(p.homeTeam, p.awayTeam, 'local');
        const probEmpate = calcularProbabilidad(null, null, 'empate');
        const probVisita = calcularProbabilidad(p.awayTeam, p.homeTeam, 'visita');
        const probMas05 = calcularProbabilidad(null, null, 'mas05');
        const probMas15 = calcularProbabilidad(null, null, 'mas15');

        // Determinar tipo de parlay
        const principal = Math.max(probLocal, probEmpate, probVisita);
        let tipoClase = "seguro", tipoEtiqueta = "PARLAY SEGURO";
        if (principal >= 80) { tipoClase = "seguro"; tipoEtiqueta = "PARLAY SEGURO"; }
        else if (principal >= 70) { tipoClase = "valor"; tipoEtiqueta = "PARLAY VALOR"; }
        else { tipoClase = "ambicioso"; tipoEtiqueta = "PARLAY AMBICIOSO"; }

        lista.innerHTML += `
            <div class="tarjeta-parlay parlay-${tipoClase}">
                <span class="etiqueta-tipo et-${tipoClase}">${tipoEtiqueta}</span>
                <div class="probabilidad-principal ${tipoClase}">${Math.round(principal)}%</div>
                <div class="equipos">⚽ ${local} 🆚 ${visitante}</div>
                <div class="liga">🏆 ${liga} — 🕐 ${hora}</div>
                <br>
                <div class="seleccion">
                    <span class="mercado">🏠 Victoria ${local}</span>
                    <span class="confianza">${Math.round(probLocal)}%</span>
                </div>
                <div class="seleccion">
                    <span class="mercado">🤝 Empate</span>
                    <span class="confianza">${Math.round(probEmpate)}%</span>
                </div>
                <div class="seleccion">
                    <span class="mercado">✈️ Victoria ${visitante}</span>
                    <span class="confianza">${Math.round(probVisita)}%</span>
                </div>
                <div class="seleccion">
                    <span class="mercado">⚽ Más de 0.5 Goles</span>
                    <span class="confianza">${Math.round(probMas05)}%</span>
                </div>
                <div class="seleccion">
                    <span class="mercado">🎯 Más de 1.5 Goles</span>
                    <span class="confianza">${Math.round(probMas15)}%</span>
                </div>
            </div>
        `;
    });
}

// 🧠 MOTOR DE CÁLCULO DE PROBABILIDADES
// Nota: Cuando tu clave esté activa y traigamos historial → reemplazamos por datos REALES
function calcularProbabilidad(equipoA, equipoB, tipo) {
    // ⚠️ ESTA VERSIÓN INICIAL usa valores base
    // ✅ Cuando traigamos el historial de cada equipo → se vuelve INTELIGENTE
    switch(tipo) {
        case 'local': return 48 + Math.random()*12; // 48-60% ventaja local
        case 'visita': return 32 + Math.random()*10; // 32-42%
        case 'empate': return 22 + Math.random()*8; // 22-30%
        case 'mas05': return 82 + Math.random()*10; // 82-92%
        case 'mas15': return 62 + Math.random()*15; // 62-77%
        default: return 50;
    }
}
</script>
</body>
</html>
